name: Add issues to project

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    name: Add issue to Be a Real Wizard project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/TheoroiDev/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
