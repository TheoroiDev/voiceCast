name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle daemon; the JDK 17 toolchain is provisioned via foojay)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build (all subprojects, JUnit 5 tests included)
        run: ./gradlew build --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload platform jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            voicecast/*/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
