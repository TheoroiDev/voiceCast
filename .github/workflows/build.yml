name: build

# Trigger policy (synced with wizardpedia/wizardreal): tags (v*) = release
# gate; PRs = pre-merge checks; push is intentionally NOT a trigger (local
# `gradlew build` is the per-push gate). Tag builds publish the release jars
# to the GitHub Release (first shipped with 0.5.0, voiceCast#50).
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release leg: tag builds publish jars to the GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (Gradle daemon; the JDK 17 toolchain is provisioned via foojay)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build (all subprojects, JUnit 5 tests included)
        run: ./gradlew build --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload platform jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            voicecast/*/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error

      # Release leg (voiceCast#50): consumer-facing platform jars only — no
      # -sources, no -dev-shadow, no common transformProduction intermediates.
      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-jars
          find voicecast -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' \
            ! -name '*transformProduction*' -exec cp {} release-jars/ \;
          ls -l release-jars
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release-jars/*
