// Applied from the four platform subprojects only (fabric/forge x
// voicecast/wizardreal). Loom run configurations:
//   - fixed dev username instead of random "Player12345"
//   - verbose bridge: `gradlew runClient -PvoicecastVerbose=true` injects
//     -Dvoicecast.verbose=true into the forked game JVM (Gradle's own -D only
//     reaches the Gradle JVM, not the game process).
//   - dev-server auto-configuration: runServer writes eula=true and flips
//     online-mode=false in the run dir before the JVM starts (other
//     server.properties keys are preserved).

def voicecastVerbose = project.findProperty("voicecastVerbose") == "true"

loom {
    runs {
        client {
            programArgs("--username", "dev")
            if (voicecastVerbose) vmArgs "-Dvoicecast.verbose=true"
        }
        server {
            // Separate run dir from the client: two live JVMs on one `run/`
            // collide on Windows file locks (log4j latest.log deletion,
            // FabricLoader run/.fabric/processedMods remap cache) and die
            // with "Failed to remap mods!" / AccessDenied. The runServer
            // eula/online-mode auto-config below follows this dir.
            // (Reproduced in wizardpedia joint testing 2026-09-02; synced to
            // all repos per AGENTS.md.)
            runDir "run-server"
            if (voicecastVerbose) vmArgs "-Dvoicecast.verbose=true"
        }
    }
}

// Run the game on the Java 17 toolchain: Gradle 9 defaults JavaExec to the
// daemon JVM (21), which makes Loom auto-upgrade LWJGL to 3.3.2-snapshot —
// i.e. the game no longer runs on the exact vanilla 1.20.1 stack
// (Java 17 + LWJGL 3.3.1). Pinning run tasks to 17 keeps the dev runtime
// identical to what players use.
tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
}

// ---- dev run auto-configuration ------------------------------------------

tasks.matching { it.name == "runServer" }.configureEach {
    doFirst {
        def runDir = project.file(loom.runs.server.runDir ?: "run")
        runDir.mkdirs()
        def eula = new File(runDir, "eula.txt")
        if (!eula.exists() || !eula.readLines().any { it.trim() == "eula=true" }) {
            eula.text = "# Auto-accepted by gradlew runServer (dev)\neula=true"
            project.logger.lifecycle("runServer: wrote ${eula} (eula=true)")
        }
        def propsFile = new File(runDir, "server.properties")
        def props = new Properties()
        if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
        if (props.getProperty("online-mode") != "false") {
            props.setProperty("online-mode", "false")
            propsFile.withOutputStream { props.store(it, "dev run configuration (managed keys may be overwritten by gradlew runServer)") }
            project.logger.lifecycle("runServer: set online-mode=false in ${propsFile}")
        }
    }
}

// ---- voice model pre-seed ----------------------------------------------------
// The workspace root keeps the pre-downloaded voicecast models (../models
// relative to this repo; see AGENTS.md). Seed them into each run dir's
// config/voicecast/models before launch so the mod's model downloader never
// re-fetches the same files. Files are HARDLINKED (java.nio Files.createLink —
// same volume, zero extra space, transparent to Vosk/ONNX and to ModelManager's
// isRegularFile/size/sha256 probes; deleting a run-side link never touches the
// workspace copy), with a plain-copy fallback for cross-volume volumes. The
// source is workspace-local (absent in CI / fresh clones) -> the task skips via
// onlyIf. Existing dest files are left untouched (never downgraded), so run
// dirs seeded by the older Copy implementation keep working as-is.
def voiceModelsSource = rootProject.file("../models")
def seedVoiceModels = { String kind, String dirName ->
    def syncTask = tasks.register("syncVoiceModels${kind.capitalize()}") {
        group = "wizard dev"
        description = "Seed voicecast models from the workspace models/ dir into ${dirName}/config/voicecast/models as hardlinks (skips when the source is absent, e.g. CI)."
        inputs.dir(voiceModelsSource)
        outputs.dir(project.file("${dirName}/config/voicecast/models"))
        onlyIf { voiceModelsSource.isDirectory() }
        doLast {
            def srcRoot = voiceModelsSource.toPath()
            def destRoot = project.file("${dirName}/config/voicecast/models").toPath()
            int linked = 0, copied = 0, kept = 0
            java.nio.file.Files.walk(srcRoot).filter { java.nio.file.Files.isRegularFile(it) }.forEach { src ->
                def dst = destRoot.resolve(srcRoot.relativize(src))
                java.nio.file.Files.createDirectories(dst.getParent())
                if (java.nio.file.Files.exists(dst)) { kept++; return }
                try {
                    java.nio.file.Files.createLink(dst, src)
                    linked++
                } catch (java.nio.file.FileAlreadyExistsException e) {
                    kept++ // concurrent launcher got there first
                } catch (IOException e) {
                    java.nio.file.Files.copy(src, dst) // cross-volume / unsupported -> real copy
                    copied++
                }
            }
            project.logger.lifecycle("syncVoiceModels(${dirName}): ${linked} hardlinked, ${copied} copied, ${kept} already present")
        }
    }
    tasks.matching { it.name == (kind == "client" ? "runClient" : "runServer") }.configureEach {
        dependsOn syncTask
    }
}
seedVoiceModels("client", loom.runs.client.runDir ?: "run")
seedVoiceModels("server", loom.runs.server.runDir ?: "run-server")
