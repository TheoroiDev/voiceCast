pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = "voicecast"

include("voicecast-common")
project(":voicecast-common").projectDir = file("voicecast/common")
include("voicecast-fabric")
project(":voicecast-fabric").projectDir = file("voicecast/fabric")
include("voicecast-forge")
project(":voicecast-forge").projectDir = file("voicecast/forge")
