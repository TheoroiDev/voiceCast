pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Toolchain provisioning for CI (runners ship JDK 21; the build pins a JDK 17 toolchain).
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "voicecast"

include("voicecast-common")
project(":voicecast-common").projectDir = file("voicecast/common")
include("voicecast-fabric")
project(":voicecast-fabric").projectDir = file("voicecast/fabric")
include("voicecast-forge")
project(":voicecast-forge").projectDir = file("voicecast/forge")
