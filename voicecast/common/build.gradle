apply from: rootProject.file("gradle/common-conventions.gradle")
apply from: rootProject.file("gradle/loom-conventions.gradle")
apply plugin: "architectury-plugin"
apply plugin: "com.gradleup.shadow"

architectury {
    common(["fabric", "forge"])
}

configurations {
    voicecastFat
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"

    // sherpa-onnx runtime (voiceCast#42): Java API + JNI natives, JitPack build
    // of the k2-fsa tag. Same pattern as ONNX: compileOnly for the API, classes
    // + per-platform natives shaded into the dev fat jar via voicecastFat (the
    // LibraryUtils chain loads natives from classpath resources
    // sherpa-onnx/native/<os-arch>/ automatically).
    compileOnly("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${rootProject.sherpa_version}")
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${rootProject.sherpa_version}") {
        transitive = false
    }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${rootProject.sherpa_version}") { transitive = false }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-x64:${rootProject.sherpa_version}") { transitive = false }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-arm64:${rootProject.sherpa_version}") { transitive = false }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-aarch64:${rootProject.sherpa_version}") { transitive = false }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-x64:${rootProject.sherpa_version}") { transitive = false }
    voicecastFat("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-aarch64:${rootProject.sherpa_version}") { transitive = false }

    // Phonetic similarity layer for the text matcher (ICU transliteration,
    // C1b): compile-only against the version the Minecraft runtime itself
    // ships (icu4j 71.1 on 1.20.1) — never bundled, so no license payload.
    compileOnly("com.ibm.icu:icu4j:71.1")

    // tar.bz2/tgz model-archive extraction (sherpa downloads, voiceCast#42).
    // compile-only against the version the Minecraft runtime itself ships
    // (1.21 on 1.20.1) — never bundled, so no relocation or license payload.
    compileOnly("org.apache.commons:commons-compress:1.21")
    // The fat bundling above only applies to the jar task; unit tests run
    // against build/classes/java/main, so libraries under test need to be on
    // the test classpath explicitly.
    testImplementation("org.apache.commons:commons-compress:1.21")
    testImplementation("com.ibm.icu:icu4j:71.1")

    // sherpa-onnx for the opt-in recognizer e2e test (natives auto-extract
    // from the classpath via sherpa's own LibraryUtils; win-x64 covers the
    // dev machine — other platforms skip the test via its guard property).
    testImplementation("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${rootProject.sherpa_version}") {
        transitive = false
    }
    testRuntimeOnly("com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${rootProject.sherpa_version}") {
        transitive = false
    }

    // ONNX Runtime for the IPA phoneme recognizer. compileOnly for the API;
    // the classes + native libs are shaded into the dev jar via voicecastFat.
    // All-platform natives are kept (server may run on Linux/arm64/macOS).
    compileOnly("com.microsoft.onnxruntime:onnxruntime:${rootProject.onnxruntime_version}")
    voicecastFat("com.microsoft.onnxruntime:onnxruntime:${rootProject.onnxruntime_version}") {
        transitive = false
    }
    // natives included; the zipa recognizer e2e tests run the real session
    testRuntimeOnly("com.microsoft.onnxruntime:onnxruntime:${rootProject.onnxruntime_version}")

    // Simple Voice Chat client-API integration (M7b). compileOnly + never
    // bundled: SVC provides the API classes at runtime; our plugin class is
    // loaded via the fabric.mod.json entrypoint key "voicechat" (Fabric) or
    // the @ForgeVoicechatPlugin annotation scan (Forge) when SVC is actually
    // installed - SVC 2.x does not use ServiceLoader - so the dependency must
    // stay out of every published artifact.
    // 2.6.x = same API generation as SVC 1.20.1-2.6.22 (the latest 1.20.1 build).
    compileOnly("de.maxhenkel.voicechat:voicechat-api:2.6.20")

    // Opus audio codec (pure Java, Java 8 bytecode, non-modular). Used to
    // compress mic audio for the client->server audio channel. Kept at its
    // original io.github.jaredmdobson.concentus package (do NOT relocate).
    compileOnly("io.github.jaredmdobson:concentus:1.0.2")
    voicecastFat("io.github.jaredmdobson:concentus:1.0.2") {
        transitive = false
    }

    // The fat bundling above only applies to the jar task; unit tests run
    // against build/classes/java/main, so libraries under test need to be on
    // the test classpath explicitly.
    testRuntimeOnly("io.github.jaredmdobson:concentus:1.0.2")
}

// Opt-in network tests (SherpaDownloadE2E) are guarded by this system
// property; -D on the gradlew command line must be forwarded to the test JVM
// explicitly or JUnit's EnabledIfSystemProperty never sees it.
tasks.withType(Test).configureEach {
    systemProperty "voicecast.e2eDownload", System.getProperty("voicecast.e2eDownload", "false")
    systemProperty "voicecast.e2eRecognizer", System.getProperty("voicecast.e2eRecognizer", "false")
    systemProperty "voicecast.e2eDenoiser", System.getProperty("voicecast.e2eDenoiser", "false")
}

jar {
    archiveClassifier = "dev"
    from {
        configurations.voicecastFat.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "module-info.class"
    exclude "META-INF/versions/**/module-info.class"
    exclude "META-INF/maven/**"
    // ONNX Runtime ships native libs for every OS; keep them all so the
    // server-side recognizer can run on Linux/arm64/macOS dedicated servers.
}

tasks.shadowJar {
    enabled = false
}

tasks.remapJar {
    enabled = false
}

tasks.assemble {
    dependsOn tasks.jar
}

// ---- Maven publication --------------------------------------------------
// The dev jar bundles sherpa-onnx/ONNX/Concentus (see the jar task above) and
// is what consumers (wizardreal) compile/run against. Published UNCLASSIFIED so
// the coordinate is group:artifactId:version without a classifier. Do NOT
// publish via components.java: remapJar is disabled for common, so Loom's
// default main artifact is the ghost unclassified jar that never exists.
apply plugin: "maven-publish"

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "voicecast-common-${rootProject.minecraft_version}"
            artifact(tasks.named("jar")) { classifier = "" }
            artifact(tasks.named("sourcesJar")) { classifier = "sources" }
            pom {
                name = "VoiceCast Common (fat dev jar)"
                description = "Server-side voice recognition library for Minecraft - platform-independent code with bundled sherpa-onnx/ONNX/Concentus."
            }
        }
    }
}
