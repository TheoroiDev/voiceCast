# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=false

# Minecraft / toolchain (1.20.1)
minecraft_version=1.20.1
# Mojang official mappings + Parchment (parameter names / javadoc), layered in
# gradle/loom-conventions.gradle. Latest Parchment release for 1.20.1.
parchment_version=2023.09.03
loader_version=0.16.10

# Forge for Minecraft 1.20.1 (the "NeoForge-era" Forge 47.x line)
forge_version=47.3.22
forge_group=net.minecraftforge

# Architectury
architectury_version=9.2.14
fabric_api_version=0.92.2+1.20.1
# Mod Menu (Fabric config screen); optional dev-only integration
modmenu_version=7.2.2

# Voice recognition
vosk_version=0.3.45
# ONNX Runtime (IPA phoneme recognizer). Jar bundles native libs for all
# platforms (win/linux/macOS x64 + arm) so dedicated servers run anywhere.
onnxruntime_version=1.19.2

# VoiceCast
voicecast_version=0.3.1
voicecast_maven_group=com.theo.voicecast
voicecast_mod_id=voicecast
voicecast_mod_name=VoiceCast

# Shared
mod_author=theo
mod_license=MIT
